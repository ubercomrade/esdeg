[project]
name = "esdeg"
version = "0.1.0"
description = "Motif enrichment analysis for differential-expression gene sets"
authors = [
    { name = "Anton Tsukanov", email = "tsukanov@bionet.nsc.ru" },
]
license = "MIT"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "mimosa-tool >=1.4.6,<2.0",
    "numpy >=2.4.6,<3.0",
    "numba >=0.66,<1.0",
    "scipy >=1.14.1,<2.0.0",
    "pandas >=2.2.3,<3.0.0",
    "panel >=1.5.5,<2.0.0",
    "plotly >=5.24.1,<6.0.0",
    "xlsxwriter >=3.2.0,<4.0.0",
    "pyjaspar >=3.0.0,<4.0.0",
    "tqdm >=4.67.1,<5.0.0"
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
]

[project.scripts]
esdeg = "esdeg.cli:main_cli"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-data]
esdeg = ["clusters/*.tsv", "hocomoco/*.jsonl", "logos/**/*.png"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
